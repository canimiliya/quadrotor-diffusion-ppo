[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quadrotor-diffusion-ppo"
version = "0.0.1"
description = "M0 GCOPTER velocity bridge and obstacle-aware CF2X sanity evaluation"
requires-python = ">=3.10"
dependencies = ["numpy", "pybullet", "gymnasium"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

